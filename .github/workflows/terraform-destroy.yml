
name: Terraform - Destroy Application Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DESTROY to confirm'
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

jobs:
  quality:
    name: Tests and Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite with coverage gate
        run: |
          python -m pytest \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=95

      - name: Run infrastructure and SQL contract tests
        run: |
          python -m pytest --no-cov tests/infrastructure tests/sql

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Create Terraform plugin cache
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform modules
        run: ./scripts/validate_terraform.sh

  destroy:
    name: Destroy Application Infrastructure
    needs: quality
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'DESTROY'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        env:
          EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          if [ -z "$EXPECTED_ACCOUNT_ID" ] ||
             [ "$ACTUAL_ACCOUNT_ID" != "$EXPECTED_ACCOUNT_ID" ]; then
            echo "ERROR: AWS account mismatch or AWS_ACCOUNT_ID is missing."
            exit 1
          fi

      - name: Destroy Terraform application modules
        shell: bash
        run: |
          set -euo pipefail

          # Reverse dependency order.
          # Keep the Terraform backend and AWS Budget intact.
          MODULES=(
            quicksight
            monitoring
            eventbridge
            step_functions
            lambda
            glue
            sns
            iam
            s3
          )

          for module in "${MODULES[@]}"; do
            if [ ! -d "terraform/$module" ]; then
              continue
            fi

            echo "=== Destroying $module ==="
            cd "terraform/$module"
            terraform init -input=false
            terraform plan -destroy -input=false
            terraform destroy -input=false -auto-approve
            cd ../..
          done

      - name: Teardown summary
        if: success()
        run: |
          echo "Application teardown completed."
          echo "Terraform state backend and AWS Budget were preserved."
