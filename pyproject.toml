[project]
name = "aws-serverless-data-platform"
version = "1.0.0"
description = "Serverless data platform for YouTube trending analytics"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "boto3>=1.34,<2",
    "pandas>=2.2,<3",
    "awswrangler>=3.9,<4",
    "pyspark>=3.5,<4",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "PyYAML>=6,<7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.coverage.run]
source = [
    "terraform/lambda/scripts",
    "terraform/glue/scripts",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=terraform/lambda/scripts --cov=terraform/glue/scripts --cov-report=term-missing --cov-report=xml --cov-fail-under=95"
